services:
  - type: web
    name: worldgpz
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: TRUST_PROXY
        value: 1
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_NAME
        value: GOD'S EYE Operator
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: worldgpz
      - key: NEWS_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: YOUTUBE_CACHE_SECONDS
        value: 10800
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: WINDY_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: NASA_FIRMS_API_KEY
        sync: false
      - key: FIRMS_SOURCES
        value: VIIRS_SNPP_NRT,MODIS_NRT
      - key: FIRMS_AREA
        value: world
      - key: FIRMS_CACHE_SECONDS
        value: "3600"
      - key: ACLED_ACCESS_TOKEN
        sync: false
      - key: ACLED_EMAIL
        sync: false
      - key: ACLED_PASSWORD
        sync: false
      - key: AISSTREAM_API_KEY
        sync: false
      - key: OPENSKY_CLIENT_ID
        sync: false
      - key: OPENSKY_CLIENT_SECRET
        sync: false
      - key: OPENSKY_BBOX
        value: -10,-30,70,60
      - key: OPENSKY_TIMEOUT_MS
        value: "20000"
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: EIA_API_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
