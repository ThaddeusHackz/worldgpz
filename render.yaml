services:
  - type: web
    name: worldgpz
    runtime: node
    plan: 0.5c-512mb
    region: oregon
    buildCommand: npm ci && npm --prefix client ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_SSL
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: worldgpz-db
          property: connectionString
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: ADMIN_NAME
        value: WORLDGPZ Administrator
      - key: JWT_SECRET
        sync: false
      - key: API_KEY_ENCRYPTION_SECRET
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: ACLED_EMAIL
        sync: false
      - key: ACLED_PASSWORD
        sync: false
      - key: OPENSKY_CLIENT_ID
        sync: false
      - key: OPENSKY_CLIENT_SECRET
        sync: false
      - key: OPENSKY_BBOX
        value: "-10,-30,70,60"
      - key: AISSTREAM_API_KEY
        sync: false
      - key: NASA_FIRMS_API_KEY
        sync: false
      - key: EIA_API_KEY
        sync: false
      - key: FRED_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: WINDY_API_KEY
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_MODEL
        value: gpt-4o-mini

databases:
  - name: worldgpz-db
    plan: 0.1c-256mb
    postgresMajorVersion: "18"
    databaseName: worldgpz
    user: worldgpz
    region: oregon
